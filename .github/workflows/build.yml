name: Build Kimetsu Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip and fix structure
        run: |
          # Giải nén file zip nguồn
          unzip -o *.zip -d extracted_files || true
          
          # Tìm thư mục chứa build.gradle thực sự trong file zip
          BUILD_DIR=$(find extracted_files -name "build.gradle" -exec dirname {} \; | head -n 1)
          
          if [ -n "$BUILD_DIR" ]; then
            echo "Tim thay code tai: $BUILD_DIR. Đang chuyen ra thu muc goc..."
            cp -r $BUILD_DIR/* .
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: kimetsu-1.21.1-fabric-mod
          path: |
            build/libs/*.jar
            */build/libs/*.jar
